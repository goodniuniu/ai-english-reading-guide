<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 · AI 指导英语阅读</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="knowledge">
  <div class="topbar">
    <div class="brand"><span class="logo">E</span>AI 指导英语阅读</div>
    <div class="nav">
      <a href="index.html">文章目录</a>
      <a class="active" href="knowledge.html">知识库</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>🧠 关键知识库 <span class="tag">跨文章聚合 · 可积累复用</span></h2>
      <div class="kb-tabs">
        <button class="kb-tab active" data-cat="concepts">核心概念词<span class="cnt"></span></button>
        <button class="kb-tab" data-cat="verbs">高级动词 / 短语<span class="cnt"></span></button>
        <button class="kb-tab" data-cat="insiders">熟词僻义<span class="cnt"></span></button>
        <button class="kb-tab" data-cat="gems">精妙小词<span class="cnt"></span></button>
      </div>
      <div class="kb-toolbar">
        <input type="text" id="kbSearch" placeholder="搜索词条、释义、例句……">
        <select id="kbSource"></select>
        <button class="btn primary" id="kbAddBtn">＋ 手动添加词条</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <h2 id="kbTitle" style="border:none;margin:0;font-family:var(--serif);font-size:18px">核心概念词</h2>
        <span id="kbCount" style="font-size:12px;color:#9aa1ab"></span>
      </div>
      <table class="vocab-table" id="kbTable">
        <thead></thead><tbody></tbody>
      </table>
      <div class="hintline" style="margin-top:14px">
        「高级动词 / 短语」模块是写作复用的主战场：造句时对照"原文例句"仿写。
        词条在多篇出现会自动合并并标注出现次数——出现越多越值得优先掌握。
      </div>
    </div>
  </div>

  <script src="assets/seed.js"></script>
  <script src="assets/articles.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
